name: Verify
description: Set up Node, install dependencies, and run typecheck, lint, and tests against a MongoDB replica set.

inputs:
  npm_token:
    description: npm token used to install dependencies.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install tools from mise.toml
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: 2026.11.12
        install_args: node npm
      env:
        MISE_USE_VERSIONS_HOST: "false"
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        registry-url: https://registry.npmjs.org
        cache: npm
    - run: npm ci
      shell: bash
      env:
        NPM_TOKEN: ${{ inputs.npm_token }}
    # The library requires a MongoDB replica set (transactions / change streams).
    # docker-compose starts a single-node replica set that self-initiates via its
    # healthcheck; wait for it to become healthy before running the suite.
    - name: Start MongoDB
      shell: bash
      run: docker compose up -d --wait
    - run: npm run typecheck
      shell: bash
    - run: npm run lint
      shell: bash
    - run: npm test
      shell: bash
    - if: always()
      shell: bash
      run: docker compose down --volumes
